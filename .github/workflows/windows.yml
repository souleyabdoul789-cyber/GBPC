name: Windows EXE
on:
  push:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install "kivy[base]==2.3.0" "kivymd==1.2.0" pymupdf pillow plyer pyinstaller
      - name: Compilation
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name G-BEPC --icon assets/icon.ico \
            --add-data "my.kv;." --add-data "assets;assets" --add-data "pdf;pdf" \
            --hidden-import gbepc_app \
            --collect-all kivy --collect-all kivymd \
            main.py
      - uses: actions/upload-artifact@v4
        with:
          name: G-BEPC-windows
          path: dist/G-BEPC.exe

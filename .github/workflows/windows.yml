name: Windows EXE Win10-11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            py-arch: x64
          - arch: x86
            py-arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 ${{ matrix.arch }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          architecture: ${{ matrix.py-arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install kivy==2.3.0 kivymd==1.2.0 PyMuPDF==1.24.9 pillow plyer pyinstaller==6.10.0

      - name: Check files
        shell: bash
        run: |
          echo "=== Structure ==="
          ls -R
          echo "=== Python ==="
          python --version
          python -c "import struct; print(f'Architecture: {struct.calcsize('P')*8} bit')"

      - name: Build EXE ${{ matrix.arch }}
        shell: bash
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name G-BEPC-${{ matrix.arch }} \
            --icon assets/icon.ico \
            --add-data "assets;assets" \
            --add-data "pdf;pdf" \
            --collect-data kivy \
            --collect-data kivymd \
            --hidden-import kivymd.icon_definitions \
            --hidden-import kivymd.uix.recycleview \
            --hidden-import kivy.core.window_sdl2 \
            --hidden-import kivy.core.text.text_sdl2 \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module IPython \
            main.py

      - name: Check build result
        shell: bash
        run: |
          ls -lh dist/
          echo "Build ${{ matrix.arch }} OK"

      - name: Upload artifact ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: G-BEPC-Win10-11-${{ matrix.arch }}
          path: dist/G-BEPC-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7
